name: Update GoatCounter visitor map

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goatcounter-map
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests pycountry

      - name: Fetch GoatCounter statistics
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          GOATCOUNTER_SITE: schreibenspiel
        run: python scripts/update_goatcounter_map.py

      - name: Commit updated public statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/goatcounter-map.json
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
          else
            git commit -m "chore: update GoatCounter visitor map data"
            git push
          fi
